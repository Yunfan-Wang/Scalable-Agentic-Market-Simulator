name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - run: python -m build
  distributed-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m sams.synthetic --output data/smoke.parquet
      - run: torchrun --standalone --nproc_per_node=2 -m sams.pretrain --config configs/smoke.yaml --data data/smoke.parquet --output runs/ddp --device cpu --max-steps 2
      - run: python -m sams.evaluate --checkpoint runs/ddp/best.pt --data data/smoke.parquet --output runs/ddp/test.json --device cpu
